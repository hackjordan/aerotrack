{% extends "base.html" %}

{% block titre %}{{ ref.titre }}{% endblock %}
{% block titre_page %}Référentiels{% endblock %}

{% block contenu %}
{% include "referentiels/_onglets.html" %}

<div class="at-card at-form-carte">
  <h2 class="h6 mb-3">{{ titre }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/formulaire.html" %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{% url 'referentiels:liste' cle %}" class="btn btn-outline-secondary">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
