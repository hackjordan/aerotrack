{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}{% endblock %} · AéroTrack</title>
  <link rel="icon" href="{% static 'img/logo-asecna.jpg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/aerotrack.css' %}">
</head>
<body class="at-simple {% block classe_page %}{% endblock %}">
  {# Gabarit sans barre latérale : page de connexion et pages d'erreur. #}
  <main class="at-simple-carte">
    <img src="{% static 'img/logo-asecna.jpg' %}" alt="Logo ASECNA" class="at-simple-logo">
    <div class="at-simple-marque"><span class="at-nom-aero">Aéro</span><span class="at-nom-track">Track</span></div>
    <p class="at-simple-sous-titre">ASECNA · Tour de contrôle de Douala</p>
    {% block contenu %}{% endblock %}
  </main>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
